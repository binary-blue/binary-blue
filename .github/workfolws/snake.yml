name: generate contribution snake

# This file belongs at: .github/workflows/snake.yml in your binary-blue/binary-blue repo.
# It generates the animated blue snake that the README embeds from the "output" branch.

on:
  schedule:
    - cron: "0 */12 * * *"   # regenerate twice a day
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                  # change to "master" here if that's this repo's default branch

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the blue contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # A custom blue palette instead of GitHub's default green:
          #   color_snake  -> the snake itself
          #   color_dots   -> the 5 contribution-intensity levels, darkest to brightest
          outputs: |
            dist/github-snake.svg?color_snake=%2358A6FF&color_dots=%230D1117,%230C2D6B,%231158C7,%23388BFD,%2358A6FF

      - name: Publish to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
